<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <!-- Base circle -->
  <circle cx="50" cy="50" r="47" fill="#f8fafc" stroke="#172033" stroke-width="6"/>
  <!-- Top red half -->
  <path d="M 3 50 A 47 47 0 0 1 97 50 Z" fill="#ef4444"/>
  <!-- Dividing black belt -->
  <line x1="3" y1="50" x2="97" y2="50" stroke="#172033" stroke-width="8"/>
  <!-- Outer center button -->
  <circle cx="50" cy="50" r="16" fill="#172033"/>
  <!-- Middle center button -->
  <circle cx="50" cy="50" r="11" fill="#f8fafc"/>
  <!-- Inner center button -->
  <circle cx="50" cy="50" r="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Gloss overlay -->
  <circle cx="50" cy="50" r="47" fill="url(#ballShine)" pointer-events="none"/>
</svg>
